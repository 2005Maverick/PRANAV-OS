services:
  - type: web
    name: pranav-os
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: LLM_MODEL_LITE
        value: gemini-flash-lite-latest
      - key: LLM_MODEL_DEEP
        value: gemini-pro-latest
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: EVENING_CLOSE
        value: "22:30"
      - key: DEFAULT_WAKE
        value: "07:45"
      - key: WEBHOOK_URL           # https://<this-service>.onrender.com
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TICK_KEY
        generateValue: true

  # The cockpit — static React build, talks to the API service above.
  - type: web
    name: pranav-os-cockpit
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API
        value: https://pranav-os.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
